# Optional: run a persistent MongoDB locally instead of the in-memory fallback.
#   docker compose up -d
#   then set MONGODB_URI=mongodb://localhost:27017/feedants in backend/.env
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
